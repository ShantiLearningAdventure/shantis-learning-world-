<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shanti's Learning World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="enhancements.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="floating-learning-art" aria-hidden="true">
        <span class="float-letter float-a">A</span>
        <span class="float-letter float-b">B</span>
        <span class="float-letter float-c">C</span>
        <span class="float-number float-one">1</span>
        <span class="float-number float-two">2</span>
        <span class="float-number float-three">3</span>
        <span class="floating-sparkle sparkle-one">✦</span>
        <span class="floating-sparkle sparkle-two">✧</span>
        <span class="floating-heart">♥</span>
      </div>

      <header class="topbar">
        <button class="nav-pill" id="homeBtn" aria-label="Go home">🏠 Home</button>
        <div class="title-badge">Shanti's Learning World</div>
        <div class="sparkle">✨</div>
      </header>

      <main class="content-panel">
        <section id="homeScreen" class="screen active">
          <div class="hero-card">
            <div class="character-scene" aria-label="Shanti Learning Adventure logo">
              <div class="logo-glow"></div>
              <img class="shanti-logo" src="assets/shanti-logo.svg" alt="Shanti's Learning Adventure logo" />
            </div>

            <div class="hero-copy">
              <p class="eyebrow">🎀 Welcome, little learner!</p>
              <h1>Let’s learn and play with Shanti!</h1>
              <p class="hero-subtitle">A happy learning adventure made for curious minds.</p>
              <p class="message-bubble">Great Job! Ready for a fun adventure?</p>
              <div class="encouragement-row" aria-label="Encouragement messages">
                <span>🌟 You can do it!</span>
                <span>💕 Keep learning!</span>
              </div>
            </div>
          </div>

          <div class="section-kicker"><span>🌸</span> Pick an adventure <span>🌸</span></div>
          <div class="quick-grid" id="categoryGrid" aria-label="Learning categories"></div>
        </section>

        <section id="activityScreen" class="screen">
          <div class="section-head">
            <button class="back-btn" id="backBtn" aria-label="Back to home">← Back</button>
            <h2 id="activityTitle">Learning Activity</h2>
          </div>
          <div id="activityContent" class="activity-content"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
